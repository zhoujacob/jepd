name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A stuck run should fail quickly instead of using hours of CI time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Placeholder values only; the checks never contact Supabase or Discord.
      - run: cp .env.example .env.local
      - run: npm run check
